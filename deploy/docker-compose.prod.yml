# Ledger on a single Linux server (e.g. an IONOS VPS).
#   cp deploy/.env.prod.example deploy/.env.prod   # fill in
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.prod up -d --build
name: ledger

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ledger_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ledger
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger_owner -d ledger"]
      interval: 5s
      retries: 20
    # Not published to the internet: only the app and migrate containers can reach it.

  migrate:
    build: { context: .., target: migrate }
    environment:
      MIGRATION_DATABASE_URL: postgres://ledger_owner:${POSTGRES_PASSWORD}@postgres:5432/ledger
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD}
      COACH_DB_PASSWORD: ${COACH_DB_PASSWORD:-}
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  app:
    build: { context: .., target: run }
    restart: unless-stopped
    env_file: .env.prod
    environment:
      # The app connects as app_login: no superuser, no BYPASSRLS, so row-level security always applies.
      DATABASE_URL: postgres://app_login:${APP_DB_PASSWORD}@postgres:5432/ledger
      BETTER_AUTH_URL: https://${DOMAIN}
    depends_on:
      migrate: { condition: service_completed_successfully }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]

volumes:
  pgdata:
  caddy_data:
  caddy_config:
